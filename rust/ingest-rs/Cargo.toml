[package]
name = "ingest-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Streaming Rust ingest hot loop for HealthVault Apple Health Export.zip"

[[bin]]
name = "healthvault-ingest"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xml-rs = { path = "../xml-rs" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
