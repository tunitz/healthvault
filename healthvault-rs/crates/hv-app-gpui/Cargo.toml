[package]
name = "hv-app-gpui"
description = "HealthVault Rust rewrite — hv-app-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hv-api = { workspace = true }
hv-core = { workspace = true }
hv-storage = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
gpui-kit = "=0.10.0"

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Headers", "Request", "RequestInit", "Response", "Window"] }
